openapi: "3.0.3"
info:
  title: "MindFlow API Documentation"
  description: "Documentação das APIs do Trabalho Denis (MindFlow)"
  version: "1.0.0"
servers:
  - url: "http://localhost:8086"
    description: "Servidor Local"
paths:
  /auth/google:
    post:
      summary: "Autentica usuário via Google ID Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
      responses:
        "200":
          description: "Autenticação bem sucedida"
  /auth/register:
    post:
      summary: "Cadastra um novo usuário"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: "Usuário criado"
        "409":
          description: "Email já cadastrado"
  /auth/login:
    post:
      summary: "Login via email e senha"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: "Login bem sucedido"
        "401":
          description: "Credenciais inválidas"
  /tasks:
    get:
      summary: "Retorna a lista de tarefas"
      responses:
        "200":
          description: "Operação bem sucedida"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    subject:
                      type: string
                    priority:
                      type: string
                    isCompleted:
                      type: boolean
    post:
      summary: "Cria uma nova tarefa"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subject:
                  type: string
                priority:
                  type: string
      responses:
        "201":
          description: "Tarefa criada"
components:
  schemas: {}
